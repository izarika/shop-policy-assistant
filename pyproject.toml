[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-policy-assistant"
version = "0.1.0"
description = "Telegram FAQ assistant with deterministic shop policies"
requires-python = ">=3.12"
dependencies = ["aiogram==3.31.0", "openai==2.54.0", "pydantic==2.13.5", "python-dotenv==1.2.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
shop-assistant = "shop_assistant.app:main"
shop-evaluate = "shop_assistant.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
